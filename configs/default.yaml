crawl:
  base_url: https://ctsv.uit.edu.vn
  # Listing sections from the site menu (checked 22/11/2026). Posts in several
  # sections are kept once; `sections` in posts_index.csv records all of them.
  sections:
    - /thong-bao                       # ~165 pages x 10 teasers, ISO dates
    - /quyet-dinh                      # ~40 pages x 30 titles, no dates
    - /quy-che-quy-dinh                # regulations, ~20 titles
    - /van-ban/thong-bao               # ~29 pages x 15 titles
    - /van-ban/ke-hoach
    - /quy-trinh
    - /bieu-mau
    - /loai-bai-viet/so-tay-sinh-vien
    - /loai-bai-viet/huong-dan
    - /loai-bai-viet/suc-khoe
    - /loai-bai-viet/tam-ly
    - /loai-bai-viet/bao-hiem-y-te
  crawl_delay_s: 10             # from robots.txt; do not lower
  user_agent: "LUMEN-CS419-UIT student project (contact: <your-email>)"
  timeout_s: 30
  max_retries: 3
  window_years: 2               # decision pending (plan section 11.1)

paths:
  listing_index: data/raw/posts_index.csv
  raw_html: data/raw/html
  raw_attachments: data/raw/attachments
  ocr_cache: data/interim/ocr
  docs: data/processed/docs.jsonl
  passages: data/processed/passages.jsonl
  runs: experiments/runs

ocr:
  engine: tesseract             # decision pending (W1-A4)
  lang: vie
  dpi: 300
  min_chars_per_page: 50        # fewer than this → treat page as scanned

passages:
  size_syllables: 200
  overlap_syllables: 30

bm25:
  k1: 1.2
  b: 0.75
  field_boost: {title: 3.0, body: 1.0, attachment: 1.0}

lsi:
  n_components: 200

dense:
  model: BAAI/bge-m3
  batch_size: 32
  top_k: 100

fusion:
  method: rrf
  rrf_k: 60

rerank:
  model: BAAI/bge-reranker-v2-m3
  depth: 50

eval:
  cutoffs: [5, 10, 100]
  primary: ndcg@10
  bootstrap_samples: 10000

boost:                          # W3-A1 metadata boost; tune on dev only
  w_recency: 0.10
  w_seq: 0.30
  w_year: 0.30
  half_life_days: 365
