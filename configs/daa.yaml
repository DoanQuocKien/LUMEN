# Second source: Office of Undergraduate Studies (daa.uit.edu.vn). Same Drupal 7 setup and
# the same `Crawl-delay: 10` as ctsv. Run: python scripts/01_crawl_listing.py --config configs/daa.yaml
# Posts are root-level slugs (/thong-bao-...), not /bai-viet/. ~2200 pages in /thongbaochinhquy
# (class-level notices included), so `since` cuts each section off by date.
crawl:
  base_url: https://daa.uit.edu.vn
  post_path: /
  since: "2025-01-01"           # decision pending (plan section 11.1)
  sections:
    - /thongbaochinhquy          # notices for regular undergraduate programmes
    - /thong-bao-chung           # general notices
    - /thong-bao-vb2             # second-degree (văn bằng 2) notices
    - /qui-che-qui-dinh-qui-trinh   # UIT regulations
  # Single pages (not listings): the post itself, usually with PDF attachments
  pages:
    - /quy-che-quy-dinh-dao-tao-dai-hoc-cua-dhqg-hcm
    - /quy-che-quy-dinh-dao-tao-dai-hoc-cua-bo-gddt
    - /mot-so-quy-trinh-danh-cho-sinh-vien   # chuyển ngành, chuyển trường, ĐKHP procedures
    - /kehoachnam                            # training calendar (image only)
    # Static pages from the site menu (checked 26/11/2026). Programme pages hang off the CTĐT menus.
    - /content/bang-tom-tat-mon-hoc          # course summaries
    - /content/cac-nganh-dao-tao
    - /content/quy-dinh-dao-tao-ngan-han
