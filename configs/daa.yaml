  select:
    since: "2025-01-01"
    # about 85% of /thongbaochinhquy is per-class notices (make-up classes, room changes): skip them
    exclude_title_regex: "nghỉ lớp|học bù|phòng học|đổi phòng|thay đổi phòng|chuyển phòng|thay đổi lịch|lịch học|lịch thi thực hành"
    reference_sections:
      - /qui-che-qui-dinh-qui-trinh
      - pages
  crawl_delay_s: 10              # from robots.txt; do not lower
  user_agent: "LUMEN-CS419-UIT student project (contact: <your-email>)"
  timeout_s: 30
  max_retries: 3

paths:
  listing_index: data/raw/daa/posts_index.csv
  raw_html: data/raw/daa/html
